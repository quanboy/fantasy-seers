spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*}

registration:
  invite-code: ${REGISTRATION_INVITE_CODE:}

security:
  # Enable ONLY when behind a trusted reverse proxy (Railway/nginx) that appends the
  # real client IP to X-Forwarded-For. Must be true on Railway, or all users share a
  # single rate-limit bucket (the proxy IP). Keep false for direct/local access.
  trust-forwarded-for: ${SECURITY_TRUST_FORWARDED_FOR:false}

sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 0.2
  environment: ${SPRING_PROFILES_ACTIVE:development}
  enable-tracing: true

sleeper:
  base-url: ${SLEEPER_API_BASE_URL:https://api.sleeper.app}
  players:
    sync-enabled: ${SLEEPER_PLAYER_SYNC_ENABLED:true}
    sync-cron: ${SLEEPER_PLAYER_SYNC_CRON:0 15 4 * * *}

league-format:
  scoring-format: ${LEAGUE_SCORING_FORMAT:FULL_PPR}
  superflex: ${LEAGUE_SUPERFLEX:false}
  confirmed: ${LEAGUE_FORMAT_CONFIRMED:false}

logging:
  level:
    com.fantasyseers: INFO
    org.springframework.security: INFO
